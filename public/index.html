<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>MongoDB Demo</title>
</head>
<body>

<h2>Login</h2>

<form id="loginForm">
  <input type="text" id="username" placeholder="Username" required />
  <input type="password" id="password" placeholder="Password" required />
  <button type="submit">Login</button>
</form>

<hr>

<h1>Отправка данных на сервер</h1>

<form id="myForm">
  <input type="text" name="text" placeholder="Текст" required>
  <input type="number" name="number" placeholder="Число" required>
  <button type="submit">Отправить</button>
</form>

<h2>Сохранённые данные:</h2>
<ul id="dataList"></ul>

<button id="refreshBtn">Обновить вручную</button>

<script>

// ---------- LOGIN ----------
const loginForm = document.getElementById('loginForm');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  const response = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ username, password })
  });

  const data = await response.json();

  if (response.ok) {
    localStorage.setItem('token', data.token);
    alert('Успешный вход!');
  } else {
    alert(data.message);
  }
});

// ---------- ELEMENTS ----------
const form = document.getElementById('myForm');
const list = document.getElementById('dataList');
const refreshBtn = document.getElementById('refreshBtn');

// ---------- LOAD DATA ----------
async function loadData() {
  try {
    const response = await fetch('/data', {
      headers: {
        'Authorization': localStorage.getItem('token')
      }
    });

    const data = await response.json();

    list.innerHTML = '';

    data.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.text} — ${item.number}`;

      // DELETE
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Удалить';
      delBtn.style.marginLeft = '10px';
      delBtn.onclick = async () => {
        await fetch(`/data/${item._id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': localStorage.getItem('token')
          }
        });
        loadData();
      };
      li.appendChild(delBtn);

      // EDIT
      const editBtn = document.createElement('button');
      editBtn.textContent = 'Редактировать';
      editBtn.style.marginLeft = '5px';
      editBtn.onclick = async () => {
        const newText = prompt('Новый текст:', item.text);
        const newNumber = prompt('Новое число:', item.number);

        if (newText !== null && newNumber !== null) {
          await fetch(`/data/${item._id}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': localStorage.getItem('token')
            },
            body: JSON.stringify({
              text: newText,
              number: Number(newNumber)
            })
          });
          loadData();
        }
      };
      li.appendChild(editBtn);

      list.appendChild(li);
    });

  } catch (err) {
    console.error('Ошибка загрузки данных:', err);
  }
}

// ---------- CREATE ----------
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData(form);

  const data = {
    text: formData.get('text'),
    number: Number(formData.get('number'))
  };

  await fetch('/data', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': localStorage.getItem('token')
    },
    body: JSON.stringify(data)
  });

  form.reset();
  loadData();
});

// ---------- REFRESH ----------
refreshBtn.addEventListener('click', loadData);

// ---------- AUTO REFRESH ----------
setInterval(loadData, 5000);

// ---------- INITIAL LOAD ----------
loadData();

</script>
</body>
</html>
